<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitbase &ndash; Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-orange: #f7931a; --accent-yellow: #fdb022; --accent-blue: #4169e1;
      --accent-green: #16c784; --accent-red: #ea3943; --accent-purple: #8b5cf6;
    }
    .am-loading { display: flex; align-items: center; gap: 10px; color: #8a8a8a; font-size: 13px; }
    .am-loading .d { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-orange); flex: 0 0 8px; }
  </style>
</head>
<body>

<!-- Shown only to accounts without admin access. They must supply the admin
     password; the right answer promotes them and opens the console. With a
     database connected the password confirms the shared secret and the first
     admin still has to grant the role. -->
<div id="amGate" class="am-gate" style="display:none;">
  <div class="ic"><i data-lucide="shield-alert" style="width:28px;height:28px;"></i></div>
  <h1>Admin access required</h1>
  <p>This account has no admin access. Enter the admin password to continue.</p>

  <div style="margin-top:26px;">
    <input class="am-input" type="password" id="amGatePw" placeholder="Admin password" style="max-width:340px;margin:0 auto 10px;display:block;">
    <button class="am-btn primary" id="amGateGo" style="max-width:340px;width:100%;padding:12px;">Unlock admin</button>
  </div>

  <div id="amGateMsg" class="am-err" style="max-width:340px;margin:14px auto 0;"></div>
  <p style="margin-top:22px;font-size:12px;color:#5a5a5a;max-width:460px;margin-left:auto;margin-right:auto;">
    Admin access for connected accounts is managed by the project owner.
  </p>
  <div style="margin-top:20px;"><a href="dashboard.html" class="am-btn">Back to Platform</a></div>
</div>

<div class="am" id="amApp" style="display:none;">

  <!-- Narrow screens only: the sidebar becomes a drawer behind this bar. -->
  <div class="am-mbar">
    <button class="am-burger" id="amBurger" aria-label="Open menu" aria-expanded="false" aria-controls="amSide">
      <i data-lucide="menu" style="width:20px;height:20px;"></i>
    </button>
    <b>BITBASE</b>
    <span class="am-badge">Admin</span>
  </div>

  <div class="am-scrim" id="amScrim"></div>

  <aside class="am-side" id="amSide">
    <div class="am-brand">
      <div class="mark">B</div>
      <b>BITBASE</b>
      <span class="am-badge">Admin</span>
      <button class="am-side-close" id="amSideClose" aria-label="Close menu">
        <i data-lucide="x" style="width:18px;height:18px;"></i>
      </button>
    </div>
    <nav class="am-nav" id="amNav"></nav>
    <div class="am-side-foot">
      <a href="dashboard.html"><i data-lucide="arrow-left"></i> Back to Platform</a>
      <a href="#" id="amLogout"><i data-lucide="log-out"></i> Logout</a>
    </div>
  </aside>

  <main class="am-main">
    <div class="am-head">
      <div>
        <h1 id="amTitle">Dashboard</h1>
        <div class="sub" id="amSub"></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="am-stamp" id="amStamp"></span>
      </div>
    </div>
    <div id="amView"></div>
  </main>
</div>

<div class="am-modal" id="amModal">
  <div class="box">
    <div class="hd">
      <h3 id="amModalTitle"></h3>
      <button class="am-x" id="amModalClose" aria-label="Close"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
    </div>
    <div class="bd" id="amModalBody"></div>
  </div>
</div>

<div id="amToast"></div>

<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/admin-page.js"></script>
</body>
</html>
